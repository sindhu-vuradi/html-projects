<!DOCTYPE html>
<html lang="en">
<head>
    <title>PRACTO APPLICATION</title>
</head>
<body>
    <header>
        <h1>
            <center>
                <font color="green">360 </font>
                <font color="blue">Practo </font>
            </center>
        </h1>
        <nav align="center">
            <a href="index.html"> Home|</a>
            <a href="Doctors.html"> About|</a>
            <a href="fb.html"> partners|</a>
            <a href="#">Doc Reg|</a>
            <a href="Doctor login.html">Doc login|</a>
            <a href="patient Registration.html">patient Reg|</a>
            <a href="patient login.html">patient login|</a>
          </nav>
    </header>
    <hr>
    <main>
        <form>
        <caption><h2>Doctor Registration Form</h2></caption>
        <table>
            <tr>
                <td>
                    <label>Name:</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Password:</label>
                </td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Email:</label>
                </td>
                <td>
                    <input type="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Phone number:</label> 
                </td>
                <td>
                    <input type="tel">
                </td>
             </tr>
             <tr>
                <td>
                    <label>Specialization:</label>
                </td>
                <td>
                  <select name="Specialization">
                    <option value="Cardiologist">Cardiologist</option>
                    <option value="Gynecologist">Gynecologist</option>
                    <option value="Physcologist">Physcologist</option>
                </select>
                </td>
             </tr>
             <tr>
                <td>
                    <label>Experience(Years):</label>
                </td>
                <td>
                    <input type="number">
                </td>
             </tr>
             <tr>
                <td>
                    <label>Gender:</label>
                </td>
                <td>
                    <input type="radio" id="male" name="gender" value="male"> Male
                    <input type="radio" id="female" name="gender" value="female"> Female
                </td>
             </tr>
             <tr>
                <td>
                    <label>Available Day:</label>
                </td>
                <td>
                    <input type="checkbox" id="id1" name="Monday" value="monday"> monday
                </td>
                <td>
                    <input type="checkbox" id="id2" name="tuesday" value="tuesday"> tuesday
                </td>
                <td>
                    <input type="checkbox" id="id3" name="wednesday" value="wednesday"> wednesday
                </td>
             </tr>
             <tr>
                <td>
                    <label>Available Time:</label>
                </td>
                <td>
                    <input type="time">
                </td>
             </tr>
             <tr>
                <td>
                    <label>Address:</label>
                </td>
                <td>
                    <textarea name="Address" rows="3" cols="10">Enter your address</textarea>
                </td>
             </tr>
             <tr>
                <td>
                    <label>Upload Certificate:</label>
                </td>
                <td>
                    <input type="file"
                </td>
             </tr>
             <tr>
                <td>
                    <input type="submit" value="Register">
                </td>
                <td>
                    <input type="reset" value="clear">
                </td>
             </tr>
            
        </table>
    </form>

    </main>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

</body>
</html>
